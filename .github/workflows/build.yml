name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download Vazirmatn font
        run: bash scripts/get-font.sh

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          grep -E '^e: ' build.log | head -60 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zx4-release-key.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/zx4-release-key.jks" >> "$GITHUB_ENV"
            echo "Release signing is configured."
          else
            echo "Signing secrets are incomplete; building an unsigned release APK."
          fi

      - name: Build optimized release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee release-build.log

      - name: Prepare APK artifacts
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk zx4-control-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk zx4-control-release.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk zx4-control-release-unsigned.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zx4-control-debug
          path: zx4-control-debug.apk

      - name: Upload signed release APK
        if: hashFiles('zx4-control-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: zx4-control-release
          path: zx4-control-release.apk

      - name: Upload unsigned release APK
        if: hashFiles('zx4-control-release-unsigned.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: zx4-control-release-unsigned
          path: zx4-control-release-unsigned.apk
